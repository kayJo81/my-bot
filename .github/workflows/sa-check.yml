name: Seeking Alpha cookie check

on:
  workflow_dispatch:

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: |
          pip install playwright==1.47.0
          python -m playwright install --with-deps chromium
      - name: Check
        env:
          SEEKING_ALPHA_COOKIES: ${{ secrets.SEEKING_ALPHA_COOKIES }}
        run: |
          python -u scripts/sa_check.py
          rm -f sa_check.png
