name: krx-login
on:
  workflow_dispatch:
    inputs:
      start: {description: "YYYYMMDD", default: "20260901"}
      end: {description: "YYYYMMDD", default: "20261120"}
jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: {node-version: "20"}
      - run: npm i playwright@1.49.1 && npx playwright install --with-deps chromium
      - env:
          KRX_ID: ${{ secrets.KRX_ID }}
          KRX_PW: ${{ secrets.KRX_PW }}
          START: ${{ inputs.start }}
          END: ${{ inputs.end }}
        run: node scripts/krx_login_fetch.mjs
      - uses: actions/upload-artifact@v4
        if: always()
        with: {name: krx-raw, path: krx_raw.json, if-no-files-found: ignore}
