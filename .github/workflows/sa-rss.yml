name: Seeking Alpha RSS

on:
  schedule:
    - cron: "35 11 * * *"   # 매일 20:35 KST, 21:30 브리핑 전에 feeds/sa/에 저장
  workflow_dispatch:
    inputs:
      tickers:
        description: "쉼표로 구분한 티커(비우면 워치리스트 전체)"
        default: ""
      save:
        description: "1이면 feeds/sa/<날짜>.json으로 커밋"
        default: "0"

permissions:
  contents: write

jobs:
  rss:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - name: Fetch
        run: |
          D=$(TZ=Asia/Seoul date +%F)
          mkdir -p feeds/sa
          python3 -u scripts/sa_rss.py "feeds/sa/$D.json" "${{ github.event.inputs.tickers }}"
          python3 -c "import json,sys;d=json.load(open(sys.argv[1]));[print(i['published'][:16],i['feed'],'|',i['title'][:100]) for i in d['items'][:15]]" "feeds/sa/$D.json"
          echo "D=$D" >> "$GITHUB_ENV"
      - name: Commit
        if: github.event_name == 'schedule' || github.event.inputs.save == '1'
        run: |
          git config user.name "my-bot"
          git config user.email "my-bot@users.noreply.github.com"
          git add "feeds/sa/$D.json"
          git commit -m "sa-rss: $D" || exit 0
          for i in 1 2 3 4; do git pull --rebase -q origin main && git push -q origin HEAD:main && break; sleep $((i*5)); done
