name: Read Naver cafe (encrypted output)

on:
  workflow_dispatch:
    inputs:
      cafe:
        description: "카페 번호(cafeId)"
        required: true
      mode:
        description: "list, read, search"
        default: "list"
      arg:
        description: "list: 스크롤 횟수 / read: 글번호(쉼표) / search: 검색어(쉼표)"
        default: "3"

jobs:
  read:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: |
          pip install playwright==1.47.0
          python -m playwright install --with-deps chromium
      - name: Read and encrypt
        env:
          NAVER_COOKIES: ${{ secrets.NAVER_COOKIES }}
          CAFE: ${{ github.event.inputs.cafe }}
          MODE: ${{ github.event.inputs.mode }}
          ARG: ${{ github.event.inputs.arg }}
        run: |
          python -u scripts/cafe_read.py "$CAFE" "$MODE" "$ARG"
          gzip -9 cafe_out.json
          # 공개 저장소라 평문을 남기지 않습니다: 세션 보관 키로만 풀 수 있게 암호화해서 출력
          openssl cms -encrypt -aes256 -binary -in cafe_out.json.gz -outform PEM scripts/cafe_cert.pem > enc.pem
          echo "=====ENC-BEGIN"
          cat enc.pem
          echo "=====ENC-END"
          rm -f cafe_out.json.gz enc.pem
